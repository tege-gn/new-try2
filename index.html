<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PIS License Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0F172A',
            card: '#1E293B',
            border: '#334155',
            muted: '#94A3B8',
          }
        }
      }
    };
  </script>
  <style>
    html, body { background: #0F172A; color: #F1F5F9; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .mono { font-family: ui-monospace, monospace; letter-spacing: 0.5px; }
  </style>
</head>
<body class="font-sans antialiased">

  <div id="app" class="max-w-md mx-auto min-h-screen pb-20"></div>
  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-card border border-border px-4 py-2 rounded-lg text-sm opacity-0 pointer-events-none transition-opacity z-50"></div>

  <script>
    // ================= CONFIG =================
    const API_URL = "https://script.google.com/macros/s/AKfycbz0XKTOk5rbF3rPZqYVtTqS2ZvlAdP4Z4jvCb8_qYqiZTIFen5ewza6p-qfnqrsSSSHVg/exec";


    // ================= STATE =================
    const state = {
        isAdmin: false,
  pendingOrders: [],
  adminLoading: false
      route: 'home',
      user: {
        chatId: null,
        name: '',
        phone: '',
        registered: false
      },
      products: [],
      buyStep: null,
      productKey: '',
      resolvedKey: null,
      paymentMode: null,
      paymentOptions: [],
      txnNumber: '',
      currentOrderId: null,
      myOrders: [],
      myLicenses: [],
      regName: '',
      regPhone: '',
      loading: false
    };

    // ================= TELEGRAM =================
   // ================= TELEGRAM + CHECK USER =================
if (window.Telegram?.WebApp) {
  const tg = Telegram.WebApp;
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0F172A');
  state.user.chatId = tg.initDataUnsafe?.user?.id?.toString() || null;
}

// Check if user is already registered
async function checkIfRegistered() {
  if (!state.user.chatId) {
    render();
    return;
  }

  try {
    // Check registration
    const res = await apiGet('checkUser', { chatId: state.user.chatId });
    if (res.success && res.registered) {
      state.user.registered = true;
      state.user.name = res.data.name;
      state.user.phone = res.data.phone;
    }

    // Check if admin
    const adminRes = await apiGet('checkAdmin', { chatId: state.user.chatId });
    if (adminRes.success && adminRes.isAdmin) {
      state.isAdmin = true;
    }
  } catch (err) {
    console.log('Startup check failed', err);
  }

  render();
}

// Call it when app starts
checkIfRegistered();

    // ================= API =================
    async function apiGet(action, params = {}) {
      const url = new URL(API_URL);
      url.searchParams.set('action', action);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString());
      return res.json();
    }

    async function apiPost(action, body = {}) {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action, ...body })
      });
      return res.json();
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._t);
      t._t = setTimeout(() => t.style.opacity = '0', 2200);
    }

    // ================= NAVIGATION =================
    function navigate(route) {
  if (!state.user.registered && route !== 'profile' && route !== 'home' && route !== 'admin') {
    toast('Please register first');
    state.route = 'profile';
    render();
    return;
  }
  state.route = route;
  window.scrollTo(0, 0);
  render();

  if (route === 'admin') {
    loadPendingOrders();
  }
}

function render() {
  const map = {
    home: renderHome,
    products: renderProducts,
    license: renderLicense,
    profile: renderProfile,
    admin: renderAdmin
  };
  document.getElementById('app').innerHTML = (map[state.route] || renderHome)();

  if (state.route === 'profile') loadProfileData();
  if (state.route === 'admin') renderPendingList();
}

    // ================= UI HELPERS =================
    function bottomNav(active) {
  const items = [
    { key: 'home',     icon: '🏠', label: 'Home' },
    { key: 'products', icon: '🛍', label: 'Products' },
    { key: 'license',  icon: '🔑', label: 'License' },
    { key: 'profile',  icon: '👤', label: 'Profile' }
  ];

  // Add Admin tab only for admins
  if (state.isAdmin) {
    items.push({ key: 'admin', icon: '🛡️', label: 'Admin' });
  }

  return `
    <nav class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-card border-t border-border flex z-40">
      ${items.map(i => `
        <button onclick="navigate('${i.key}')" class="flex-1 py-3 text-center text-xs ${active === i.key ? 'text-emerald-400' : 'text-muted'}">
          <div class="text-lg mb-0.5">${i.icon}</div>
          <div>${i.label}</div>
        </button>
      `).join('')}
    </nav>`;
}

    function header(title, back = null) {
      return `
        <header class="sticky top-0 z-30 bg-bg/95 backdrop-blur border-b border-border">
          <div class="flex items-center px-4 h-14 gap-3">
            ${back ? `<button onclick="${back}" class="text-2xl">←</button>` : ''}
            <h1 class="font-semibold">${title}</h1>
          </div>
        </header>`;
    }
// ================= ADMIN =================
function renderAdmin() {
  if (!state.isAdmin) {
    return `
      ${header('Admin')}
      <main class="px-4 pt-10 text-center text-muted">Access denied</main>
      ${bottomNav('admin')}`;
  }

  return `
    ${header('Admin Panel')}
    <main class="px-4 pt-4 pb-28 space-y-4 fade-in">

      <div class="bg-card border border-border rounded-xl p-4">
        <div class="flex items-center justify-between">
          <div>
            <div class="font-semibold">Pending Orders</div>
            <div class="text-xs text-muted">Manual approval</div>
          </div>
          <button onclick="loadPendingOrders()" class="text-sm text-emerald-400">Refresh</button>
        </div>
      </div>

      <div id="pendingList">
        ${state.adminLoading ? `<p class="text-center text-muted py-8">Loading...</p>` : ''}
      </div>

    </main>
    ${bottomNav('admin')}`;
}

async function loadPendingOrders() {
  state.adminLoading = true;
  render();

  const res = await apiGet('getPendingOrders');
  state.adminLoading = false;

  if (res.success) {
    state.pendingOrders = res.data || [];
  } else {
    toast(res.message || 'Failed to load orders');
    state.pendingOrders = [];
  }

  render();
  renderPendingList();
}

function renderPendingList() {
  const container = document.getElementById('pendingList');
  if (!container) return;

  if (!state.pendingOrders.length) {
    container.innerHTML = `
      <div class="bg-card border border-border rounded-xl p-6 text-center text-muted text-sm">
        No pending orders
      </div>`;
    return;
  }

  container.innerHTML = state.pendingOrders.map(o => `
    <div class="bg-card border border-border rounded-xl p-4 mb-3">
      <div class="flex justify-between items-start mb-2">
        <div>
          <div class="font-medium">${o.productCode}</div>
          <div class="text-xs text-muted mono">${o.orderId}</div>
        </div>
        <span class="text-xs text-amber-400">PENDING</span>
      </div>

      <div class="text-sm space-y-1 mb-3">
        <div class="flex justify-between">
          <span class="text-muted">Product Key</span>
          <span class="mono text-xs">${o.productKey}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Txn Number</span>
          <span class="mono text-xs">${o.txnNumber}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Phone</span>
          <span>${o.phone || '-'}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Chat ID</span>
          <span class="text-xs">${o.chatId}</span>
        </div>
      </div>

      <button onclick="approveOrder('${o.orderId}')" 
        class="w-full py-2.5 rounded-lg bg-emerald-500 text-white text-sm font-semibold">
        ✅ Approve & Send License
      </button>
    </div>
  `).join('');
}

async function approveOrder(orderId) {
  if (!confirm('Approve this order and send license key?')) return;

  toast('Approving...');
  const res = await apiPost('approveOrder', { orderId });

  if (res.success) {
    toast('Order approved successfully');
    // Remove from list
    state.pendingOrders = state.pendingOrders.filter(o => o.orderId !== orderId);
    renderPendingList();
  } else {
    toast(res.message || 'Approval failed');
  }
}
    
    // ================= HOME =================
   function renderHome() {
  return `
    ${header('PIS License Store')}
    <main class="px-4 pt-5 space-y-5 fade-in pb-8">

      <!-- Hero -->
      <div class="bg-gradient-to-br from-emerald-500/20 to-card border border-border rounded-2xl p-5 text-center">
        <div class="text-4xl mb-2">🔐</div>
        <h2 class="text-xl font-bold text-emerald-400">PIS License Store</h2>
        <p class="text-sm text-slate-300 mt-2">Official license activation for Pharmacy & Clinic POS systems.</p>
      </div>

      <!-- Registration Status -->
      ${!state.user.registered ? `
        <div class="bg-amber-500/10 border border-amber-500/40 rounded-xl p-4">
          <div class="font-medium text-amber-300 mb-1">Registration Required</div>
          <p class="text-sm text-slate-300 mb-3">Please register first to buy a license.</p>
          <button onclick="navigate('profile')" class="w-full py-2.5 rounded-lg bg-amber-500 text-black font-semibold text-sm">
            Register Now
          </button>
        </div>
      ` : `
        <div class="bg-emerald-500/10 border border-emerald-500/40 rounded-xl p-4 flex items-center gap-3">
          <div class="text-2xl">✅</div>
          <div>
            <div class="font-medium text-emerald-300">Welcome, ${state.user.name}</div>
            <div class="text-xs text-muted">You are registered</div>
          </div>
        </div>
      `}

      <!-- How it works -->
      <div class="bg-card border border-border rounded-xl p-4">
        <h3 class="text-sm font-semibold mb-3 text-slate-200">How it works</h3>
        <div class="space-y-3 text-sm">
          <div class="flex gap-3">
            <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold">1</div>
            <div>
              <div class="font-medium">Register</div>
              <div class="text-muted text-xs">Create your account using phone number</div>
            </div>
          </div>
          <div class="flex gap-3">
            <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold">2</div>
            <div>
              <div class="font-medium">Download APK</div>
              <div class="text-muted text-xs">Get the app from Products page</div>
            </div>
          </div>
          <div class="flex gap-3">
            <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold">3</div>
            <div>
              <div class="font-medium">Buy License</div>
              <div class="text-muted text-xs">Enter Product Key and make payment</div>
            </div>
          </div>
          <div class="flex gap-3">
            <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold">4</div>
            <div>
              <div class="font-medium">Activate</div>
              <div class="text-muted text-xs">Receive License Key after approval</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Features -->
      <div class="bg-card border border-border rounded-xl p-4">
        <h3 class="text-sm font-semibold mb-3 text-slate-200">Features</h3>
        <div class="grid grid-cols-2 gap-3 text-sm">
          <div class="bg-bg rounded-lg p-3 border border-border">
            <div class="text-lg mb-1">⚡</div>
            <div class="font-medium">Fast Activation</div>
            <div class="text-xs text-muted">Quick license delivery</div>
          </div>
          <div class="bg-bg rounded-lg p-3 border border-border">
            <div class="text-lg mb-1">🔒</div>
            <div class="font-medium">Secure</div>
            <div class="text-xs text-muted">Unique product keys</div>
          </div>
          <div class="bg-bg rounded-lg p-3 border border-border">
            <div class="text-lg mb-1">📱</div>
            <div class="font-medium">Offline App</div>
            <div class="text-xs text-muted">Works without internet</div>
          </div>
          <div class="bg-bg rounded-lg p-3 border border-border">
            <div class="text-lg mb-1">💳</div>
            <div class="font-medium">Local Payment</div>
            <div class="text-xs text-muted">Bank & Telebirr</div>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="navigate('products')" class="py-3 rounded-xl bg-card border border-border font-medium text-sm">
          🛍 Products
        </button>
        <button onclick="navigate('license')" class="py-3 rounded-xl bg-emerald-500 text-white font-medium text-sm">
          🔑 Buy License
        </button>
      </div>

    </main>
    ${bottomNav('home')}`;
}

    // ================= PRODUCTS =================
    async function loadProducts() {
      state.loading = true;
      render();
      const res = await apiGet('getProducts');
      state.loading = false;
      if (res.success) state.products = res.data || [];
      else toast(res.message || 'Failed to load products');
      render();
    }

    function renderProducts() {
      if (state.products.length === 0 && !state.loading) loadProducts();

      return `
        ${header('Products')}
        <main class="px-4 pt-4 space-y-3 fade-in">
          ${state.loading ? `<p class="text-center text-muted py-10">Loading...</p>` : ''}
          ${state.products.map(p => `
            <div class="bg-card border border-border rounded-xl p-4">
              <div class="flex items-center gap-3 mb-2">
                <div class="text-3xl">${p.icon || '📦'}</div>
                <div>
                  <div class="font-medium">${p.name}</div>
                  <div class="text-xs text-muted">v${p.version} · ${p.price} ETB</div>
                </div>
              </div>
              <p class="text-sm text-slate-300 mb-3">${p.description || ''}</p>
              <button onclick="downloadApk('${p.code}')" class="w-full py-2.5 rounded-lg bg-emerald-500 text-white text-sm font-semibold">
                ⬇ Download APK
              </button>
            </div>
          `).join('') || (!state.loading ? `<p class="text-center text-muted py-10">No products found</p>` : '')}
        </main>
        ${bottomNav('products')}`;
    }

    async function downloadApk(code) {
      toast('Getting link...');
      const res = await apiGet('getApkLink', { productCode: code });
      if (res.success && res.data?.downloadUrl) {
        window.open(res.data.downloadUrl, '_blank');
      } else {
        toast(res.message || 'Download not available');
      }
    }

    // ================= LICENSE FLOW =================
function renderLicense() {
  if (!state.buyStep) state.buyStep = 'key';

  switch (state.buyStep) {
    case 'key':      return renderLicenseKey();
    case 'payment':  return renderLicensePayment();   // price + payment details
    case 'txn':      return renderLicenseTxn();
    case 'done':     return renderLicenseDone();
    default:         state.buyStep = 'key'; return renderLicenseKey();
  }
}

function renderLicenseKey() {
  return `
    ${header('Buy License')}
    <main class="px-4 pt-6 pb-32 space-y-5 fade-in">
      <div class="text-center">
        <div class="text-4xl mb-2">🔑</div>
        <p class="text-sm text-slate-300">Enter your Product Key to continue</p>
      </div>

      <div>
        <label class="text-xs text-muted uppercase tracking-wider mb-1 block">Product Key</label>
        <input type="text" value="${state.productKey}" 
          oninput="state.productKey = this.value"
          placeholder="e.g. 178D4F76"
          class="w-full bg-bg border border-border rounded-lg px-3 py-3 text-sm mono" />
      </div>
    </main>

    <div class="fixed bottom-16 inset-x-0 max-w-md mx-auto p-4 z-40">
      <button onclick="resolveKey()" class="w-full py-3 rounded-xl bg-emerald-500 text-white font-semibold">
        Continue
      </button>
    </div>
    ${bottomNav('license')}`;
}

async function resolveKey() {
  if (!state.productKey.trim()) return toast('Please enter Product Key');

  toast('Checking Product Key...');
  const res = await apiPost('resolveKey', { productKey: state.productKey.trim() });

  if (!res.success) {
    toast(res.message || 'Invalid Product Key');
    return;
  }

  state.resolvedKey = res.data;
  state.paymentMode = null;
  state.paymentOptions = [];
  state.buyStep = 'payment';
  render();

  // Load payment methods
  loadPaymentMethods(res.data.productCode);
}

async function loadPaymentMethods(productCode) {
  const res = await apiGet('getPaymentMethods', { productCode });
  if (res.success) {
    state.paymentOptions = res.data || [];
    render();
  }
}

function renderLicensePayment() {
  const d = state.resolvedKey;

  // Group payment options
  const bankOptions = state.paymentOptions.filter(o => o.mode === 'BANK');
  const telebirrOptions = state.paymentOptions.filter(o => o.mode === 'TELEBIRR');

  return `
    ${header('Payment Details', "state.buyStep='key'; render()")}
    <main class="px-4 pt-5 pb-36 space-y-4 fade-in">

      <!-- Order Summary -->
      <div class="bg-card border border-border rounded-xl p-4 space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-muted">Product</span>
          <span class="font-medium">${d.productName}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Product Key</span>
          <span class="mono text-xs">${d.productKey}</span>
        </div>
        <div class="flex justify-between pt-2 border-t border-border">
          <span class="text-muted">Amount to Pay</span>
          <span class="text-emerald-400 font-bold text-lg">${d.price} ETB</span>
        </div>
      </div>

      <!-- Payment Methods -->
      <div class="space-y-3">
        <h3 class="text-xs uppercase tracking-wider text-muted">Payment Methods</h3>

        ${bankOptions.length ? `
          <div class="bg-card border border-border rounded-xl p-4">
            <div class="font-medium mb-3">🏦 Bank Transfer</div>
            ${bankOptions.map(o => `
              <div class="mb-3 last:mb-0 pb-3 last:pb-0 border-b last:border-0 border-border">
                <div class="font-medium text-sm">${o.bank}</div>
                <div class="text-xs text-muted">${o.accountName}</div>
                <div class="mono text-sm mt-1">${o.accountNumber}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${telebirrOptions.length ? `
          <div class="bg-card border border-border rounded-xl p-4">
            <div class="font-medium mb-3">📱 Telebirr</div>
            ${telebirrOptions.map(o => `
              <div class="mono text-lg">${o.wallet}</div>
            `).join('')}
          </div>
        ` : ''}

        ${!bankOptions.length && !telebirrOptions.length ? `
          <div class="text-sm text-muted text-center py-4">No payment methods available</div>
        ` : ''}
      </div>

      <p class="text-xs text-muted text-center">
        Make the payment using one of the methods above, then click the button below.
      </p>
    </main>

    <div class="fixed bottom-16 inset-x-0 max-w-md mx-auto p-4 z-40">
      <button onclick="state.buyStep='txn'; render()" 
        class="w-full py-3 rounded-xl bg-emerald-500 text-white font-semibold">
        💳 I Have Paid
      </button>
    </div>
    ${bottomNav('license')}`;
}

function renderLicenseTxn() {
  return `
    ${header('Transaction Number', "state.buyStep='payment'; render()")}
    <main class="px-4 pt-6 pb-32 space-y-5 fade-in">
      <p class="text-sm text-slate-300">
        Enter the Transaction Number from your payment receipt.
      </p>

      <div>
        <label class="text-xs text-muted uppercase tracking-wider mb-1 block">Transaction Number</label>
        <input type="text" value="${state.txnNumber}"
          oninput="state.txnNumber = this.value"
          placeholder="e.g. TXN123456 or reference number"
          class="w-full bg-bg border border-border rounded-lg px-3 py-3 text-sm mono" />
      </div>
    </main>

    <div class="fixed bottom-16 inset-x-0 max-w-md mx-auto p-4 z-40">
      <button onclick="submitOrder()" class="w-full py-3 rounded-xl bg-emerald-500 text-white font-semibold">
        Submit Order
      </button>
    </div>
    ${bottomNav('license')}`;
}

async function submitOrder() {
  if (!state.txnNumber.trim()) return toast('Please enter Transaction Number');
  if (!state.user.chatId) return toast('User not found');

  toast('Submitting order...');

  const res = await apiPost('createOrder', {
    chatId: state.user.chatId,
    phone: state.user.phone || '',
    productKey: state.productKey.trim(),
    productCode: state.resolvedKey.productCode,
    paymentMode: state.paymentMode || 'BANK',
    txnNumber: state.txnNumber.trim()
  });

  if (!res.success) {
    toast(res.message || 'Failed to submit order');
    return;
  }

  state.currentOrderId = res.data.orderId;
  state.buyStep = 'done';
  render();
}

function renderLicenseDone() {
  return `
    ${header('Order Submitted')}
    <main class="px-4 pt-10 pb-32 text-center space-y-4 fade-in">
      <div class="text-5xl">⏳</div>
      <h2 class="text-lg font-semibold">Under Process for Approval</h2>
      
      <div class="bg-card border border-border rounded-xl p-4 text-sm text-left space-y-2">
        <div class="flex justify-between">
          <span class="text-muted">Order ID</span>
          <span class="mono">${state.currentOrderId}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Status</span>
          <span class="text-amber-400">Pending Approval</span>
        </div>
      </div>

      <p class="text-sm text-muted">
        Your payment is being reviewed.<br>
        You will receive the License Key after approval.
      </p>
    </main>

    <div class="fixed bottom-16 inset-x-0 max-w-md mx-auto p-4 z-40">
      <button onclick="resetBuy(); navigate('profile')" 
        class="w-full py-3 rounded-xl bg-emerald-500 text-white font-semibold">
        Go to My Orders
      </button>
    </div>
    ${bottomNav('license')}`;
}

function resetBuy() {
  state.buyStep = null;
  state.productKey = '';
  state.resolvedKey = null;
  state.paymentMode = null;
  state.paymentOptions = [];
  state.txnNumber = '';
  state.currentOrderId = null;
}

    // ================= PROFILE =================
    function renderProfile() {
      return `
        ${header('Profile')}
        <main class="px-4 pt-4 space-y-4 fade-in">
          ${!state.user.registered ? `
            <div class="bg-card border border-border rounded-xl p-4 space-y-3">
              <h2 class="font-semibold">Registration Required</h2>
              <input type="text" placeholder="Full Name" value="${state.regName}" oninput="state.regName=this.value"
                class="w-full bg-bg border border-border rounded-lg px-3 py-2.5 text-sm" />
              <input type="tel" placeholder="Phone Number" value="${state.regPhone}" oninput="state.regPhone=this.value"
                class="w-full bg-bg border border-border rounded-lg px-3 py-2.5 text-sm" />
              <button onclick="register()" class="w-full py-2.5 rounded-lg bg-emerald-500 text-white font-medium">
                Register
              </button>
            </div>
          ` : `
            <div class="bg-card border border-border rounded-xl p-4">
              <div class="font-semibold">${state.user.name}</div>
              <div class="text-xs text-muted mono mt-1">Chat ID: ${state.user.chatId}</div>
              <div class="text-sm text-emerald-400 mt-2">✅ Registered</div>
            </div>
          `}

          <div>
            <h2 class="text-xs uppercase text-muted mb-2">My Licenses</h2>
            <div id="licensesList" class="text-sm text-muted">Loading...</div>
          </div>

          <div>
            <h2 class="text-xs uppercase text-muted mb-2">My Orders</h2>
            <div id="ordersList" class="text-sm text-muted">Loading...</div>
          </div>
        </main>
        ${bottomNav('profile')}`;
    }

    async function register() {
      if (!state.regName.trim() || !state.regPhone.trim()) return toast('Enter name and phone');
      if (!state.user.chatId) return toast('Telegram ID not found');

      toast('Registering...');
      const res = await apiPost('register', {
        chatId: state.user.chatId,
        name: state.regName.trim(),
        phone: state.regPhone.trim()
      });

      if (res.success) {
        state.user.registered = true;
        state.user.name = state.regName.trim();
        state.user.phone = state.regPhone.trim();
        toast(`Registered! User: ${res.data.username} / Pass: ${res.data.password}`);
        render();
      } else {
        toast(res.message || 'Registration failed');
      }
    }

    async function loadProfileData() {
      if (!state.user.chatId) return;
      const [orders, licenses] = await Promise.all([
        apiGet('getMyOrders', { chatId: state.user.chatId }),
        apiGet('getMyLicenses', { chatId: state.user.chatId })
      ]);

      const ordersEl = document.getElementById('ordersList');
      const licensesEl = document.getElementById('licensesList');

      if (ordersEl) {
        if (orders.success && orders.data.length) {
          ordersEl.innerHTML = orders.data.map(o => `
            <div class="bg-card border border-border rounded-xl p-3 mb-2">
              <div class="flex justify-between text-sm">
                <span>${o.productCode}</span>
                <span class="${o.status==='APPROVED'?'text-emerald-400':o.status==='REJECTED'?'text-red-400':'text-amber-400'}">${o.status}</span>
              </div>
              <div class="text-xs text-muted mt-1">Txn: ${o.txnNumber}</div>
            </div>
          `).join('');
        } else {
          ordersEl.innerHTML = `<div class="bg-card border border-border rounded-xl p-4 text-center">No orders yet</div>`;
        }
      }

      if (licensesEl) {
        if (licenses.success && licenses.data.length) {
          licensesEl.innerHTML = licenses.data.map(l => `
            <div class="bg-card border border-border rounded-xl p-3 mb-2">
              <div class="font-medium text-sm">${l.productCode}</div>
              <div class="text-xs text-muted">Key: ${l.productKey}</div>
              <div class="mono text-emerald-400 mt-1">${l.licenseKey}</div>
            </div>
          `).join('');
        } else {
          licensesEl.innerHTML = `<div class="bg-card border border-border rounded-xl p-4 text-center">No licenses yet</div>`;
        }
      }
    }

    // ================= RENDER =================
    function render() {
      const map = {
        home: renderHome,
        products: renderProducts,
        license: renderLicense,
        profile: renderProfile
      };
      document.getElementById('app').innerHTML = (map[state.route] || renderHome)();
      if (state.route === 'profile') loadProfileData();
    }

    render();
  </script>
</body>
</html>
