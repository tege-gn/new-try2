    const API_URL = "https://script.google.com/macros/s/AKfycbxHi6EIaMeDyD0mUDZz6cNjyF6zvD5IhOhQD0KdakM2QoBtRmiec4CqIs7y4I_l5ez1Vw/exec";


    // ================= STATE =================

  isAdmin: false,
  pendingOrders: [],
  adminLoading: false,
  route: 'home',
  user: {
    chatId: null,
    name: '',
    phone: '',
    registered: false
  },
  products: [],
  buyStep: null,
  productKey: '',
  resolvedKey: null,
  paymentMode: null,
  selectedProduct: null,
  selectedProductCode: null,
  paymentOptions: [],
  txnNumber: '',
  currentOrderId: null,
  myOrders: [],
  myLicenses: [],
  regName: '',
  regPhone: '',
  loading: false,
  appReady: false,

   // ================= TELEGRAM + CHECK USER =================
if (window.Telegram?.WebApp) {
  const tg = Telegram.WebApp;
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0F172A');
  state.user.chatId = tg.initDataUnsafe?.user?.id?.toString() || null;
}

// Check if user is already registered
async function checkIfRegistered() {
  if (!state.user.chatId) {
    state.appReady = true;
    render();
    return;
  }

  try {
    const res = await apiGet('checkUser', { chatId: state.user.chatId });
    if (res.success && res.registered) {
      state.user.registered = true;
      state.user.name = res.data.name;
      state.user.phone = res.data.phone;
    }

    const adminRes = await apiGet('checkAdmin', { chatId: state.user.chatId });
    if (adminRes.success && adminRes.isAdmin) {
      state.isAdmin = true;
    }
  } catch (err) {
    console.log('Startup check failed', err);
  }

  state.appReady = true;
  render();
}

// Call it when app starts
checkIfRegistered();

    // ================= API =================
    async function apiGet(action, params = {}) {
      const url = new URL(API_URL);
      url.searchParams.set('action', action);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString());
      return res.json();
    }

    async function apiPost(action, body = {}) {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action, ...body })
      });
      return res.json();
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._t);
      t._t = setTimeout(() => t.style.opacity = '0', 2200);
    }

    // ================= NAVIGATION =================
  function navigate(route) {
  if (state.isAdmin) {
    if (!route.startsWith('admin')) {
      route = 'admin-dashboard';
    }
  } else {
    if (!state.user.registered && route !== 'profile' && route !== 'home') {
      toast('Please register first');
      route = 'profile';
    }
  }

  state.route = route;
  window.scrollTo(0, 0);
  render();

  if (route === 'admin-approvals') {
    loadPendingOrders();
  }

  if (route === 'admin-dashboard') {
    setTimeout(loadAdminDashboard, 150);
  }
}



    // ================= UI HELPERS =================
  function bottomNav(active) {
  if (state.isAdmin) {
    const adminItems = [
      { key: 'admin-dashboard', icon: '📊', label: 'Dashboard' },
      { key: 'admin-approvals', icon: '✅', label: 'Approvals' },
    ];
    return `
      <nav class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-card border-t border-border flex z-40">
        ${adminItems.map(i => `
          <button onclick="navigate('${i.key}')" class="flex-1 py-3 text-center text-xs ${active === i.key ? 'text-emerald-400' : 'text-muted'}">
            <div class="text-lg mb-0.5">${i.icon}</div>
            <div>${i.label}</div>
          </button>
        `).join('')}
      </nav>`;
  }

  const items = [
    { key: 'home',     icon: '🏠', label: t('nav_home') },
    { key: 'products', icon: '🛍', label: t('nav_products') },
    { key: 'license',  icon: '🔑', label: t('nav_license') },
    { key: 'profile',  icon: '👤', label: t('nav_profile') }
  ];

  return `
    <nav class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-card border-t border-border flex z-40">
      ${items.map(i => `
        <button onclick="navigate('${i.key}')" class="flex-1 py-3 text-center text-xs ${active === i.key ? 'text-emerald-400' : 'text-muted'}">
          <div class="text-lg mb-0.5">${i.icon}</div>
          <div>${i.label}</div>
        </button>
      `).join('')}
    </nav>`;
}
    function header(title, back = null) {
      return `
        <header class="sticky top-0 z-30 bg-bg/95 backdrop-blur border-b border-border">
          <div class="flex items-center px-4 h-14 gap-3">
            ${back ? `<button onclick="${back}" class="text-2xl">←</button>` : ''}
            <h1 class="font-semibold">${title}</h1>
          </div>
        </header>`;
    }
// ================= ADMIN =================
function renderAdminApprovals() {
  return `
    ${header('Pending Approvals')}
    <main class="px-4 pt-4 pb-28 space-y-4 fade-in">

      <div class="flex items-center justify-between">
        <div class="text-sm text-muted">Orders waiting for approval</div>
        <button onclick="loadPendingOrders()" class="text-sm text-emerald-400">Refresh</button>
      </div>

      <div id="pendingList">
        ${state.adminLoading ? `<p class="text-center text-muted py-10">Loading...</p>` : ''}
      </div>

    </main>
    ${bottomNav('admin-approvals')}`;
}

    
function renderAdminDashboard() {
  return `
    ${header('Admin Dashboard')}

      <!-- Admin info -->
      <div class="bg-card border border-border rounded-xl p-4">

        <div class="text-xs text-muted mono">${state.user.chatId}</div>
      </div>

      <!-- Stats cards -->
      <div class="grid grid-cols-2 gap-3" id="adminStats">
        <div class="bg-card border border-border rounded-xl p-4 text-center">
          <div class="text-2xl font-bold text-amber-400" id="statPending">-</div>

        </div>
        <div class="bg-card border border-border rounded-xl p-4 text-center">
          <div class="text-2xl font-bold text-emerald-400" id="statSold">-</div>

        </div>
        <div class="bg-card border border-border rounded-xl p-4 text-center">
          <div class="text-2xl font-bold text-sky-400" id="statMonth">-</div>

      <!-- Quick action -->
      <button onclick="navigate('admin-approvals')" 
        class="w-full py-3 rounded-xl bg-emerald-500 text-white font-semibold">
        ✅ Go to Approvals
      </button>

      <!-- Latest pending preview -->
      <div class="bg-card border border-border rounded-xl p-4">
        <div class="flex items-center justify-between mb-3">
          <div class="font-medium text-sm">Latest Pending</div>
          <button onclick="loadAdminDashboard()" class="text-xs text-emerald-400">Refresh</button>
        </div>
        <div id="latestPending" class="space-y-2 text-sm text-muted">

    // Load Admin Dashnoard-------------
    
async function loadAdminDashboard() {
  // Load stats
  const statsRes = await apiGet('getAdminStats');
  if (statsRes.success) {
    const d = statsRes.data;
    const el = (id) => document.getElementById(id);
    if (el('statPending')) el('statPending').textContent = d.pendingOrders;
    if (el('statSold')) el('statSold').textContent = d.soldLicenses;
    if (el('statMonth')) el('statMonth').textContent = d.approvedThisMonth;
    if (el('statUsers')) el('statUsers').textContent = d.registeredUsers;
  }

  // Load latest pending (max 3)
  const pendingRes = await apiGet('getPendingOrders');
  const container = document.getElementById('latestPending');
  if (!container) return;

  if (pendingRes.success && pendingRes.data.length) {
    const latest = pendingRes.data.slice(0, 3);
    container.innerHTML = latest.map(o => `
      <div class="flex justify-between items-center py-2 border-b border-border last:border-0">
        <div>
          <div class="font-medium text-slate-200">${o.productCode}</div>
          <div class="text-xs text-muted mono">${o.productKey}</div>
        </div>
        <div class="text-xs text-amber-400">PENDING</div>
      </div>
    `).join('');
  } else {
    container.innerHTML = `<div class="text-center py-3">No pending orders</div>`;
  }
}
    
async function loadPendingOrders() {
  state.adminLoading = true;
  render();

  const res = await apiGet('getPendingOrders');
  state.adminLoading = false;

  if (res.success) {
    state.pendingOrders = res.data || [];
  } else {
    toast(res.message || 'Failed to load orders');
    state.pendingOrders = [];
  }

  render();
  renderPendingList();
}


 // ================= Apending list=================   
    
function renderPendingList() {
  const container = document.getElementById('pendingList');
  if (!container) return;

  if (!state.pendingOrders.length) {
    container.innerHTML = `
      <div class="bg-card border border-border rounded-xl p-6 text-center text-muted text-sm">
        No pending orders
      </div>`;
    return;
  }

  container.innerHTML = state.pendingOrders.map(o => `
    <div class="bg-card border border-border rounded-xl p-4 mb-3">
      <div class="flex justify-between items-start mb-2">
        <div>
          <div class="font-medium">${o.productCode}</div>
          <div class="text-xs text-muted mono">${o.orderId}</div>
        </div>
        <span class="text-xs text-amber-400">PENDING</span>
      </div>

      <div class="text-sm space-y-1 mb-3">
        <div class="flex justify-between">
          <span class="text-muted">Product Key</span>
          <span class="mono text-xs">${o.productKey}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Txn Number</span>
          <span class="mono text-xs">${o.txnNumber}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Phone</span>
          <span>${o.phone || '-'}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Chat ID</span>
          <span class="text-xs">${o.chatId}</span>
        </div>
      </div>

      <!-- NEW BUTTON GROUP -->
      <div class="flex gap-2">
        <button onclick="rejectOrder('${o.orderId}')" 
          class="w-full py-2.5 rounded-lg bg-red-500/15 text-red-400 border border-red-500/30 text-sm font-semibold active:bg-red-500/25">
          ✖ Cancel
        </button>
        <button onclick="approveOrder('${o.orderId}')" 
          class="w-full py-2.5 rounded-lg bg-emerald-500 text-white text-sm font-semibold">
           ✅ Approve
        </button>
      </div>
    </div>
  `).join('');
}

    async function approveOrder(orderId) {
  if (!confirm('Approve this order and send license key?')) return;

  toast('Approving...');
  
  try {
    const res = await apiPost('approveOrder', { orderId });

    if (res.success) {
      toast('✅ Order Approved!');
      // Remove from list immediately so it disappears from the UI
      state.pendingOrders = state.pendingOrders.filter(o => o.orderId !== orderId);
      renderPendingList();
    } else {
      toast(res.message || 'Approval failed');
    }
  } catch (err) {
    toast('Network error. Check connection.');
  }
}
    
async function rejectOrder(orderId) {
  if (!confirm('Are you sure you want to cancel this order?')) return;

  toast('Cancelling...');
  const res = await apiPost('rejectOrder', { orderId });

  if (res.success) {
    toast('Order cancelled');
    // Remove from list immediately
    state.pendingOrders = state.pendingOrders.filter(o => o.orderId !== orderId);
    renderPendingList();
  } else {
    toast(res.message || 'Failed to cancel order');
  }
}

// Helper: convert Google Drive links to direct image URL
function getDriveImageUrl(link) {
  if (!link) return null;

  let fileId = null;
  const str = String(link).trim();

  // Extract File ID from different Drive link formats
  const patterns = [
    /\/file\/d\/([a-zA-Z0-9_-]+)/,
    /[?&]id=([a-zA-Z0-9_-]+)/,
    /\/d\/([a-zA-Z0-9_-]+)/
  ];

  for (const pattern of patterns) {
    const match = str.match(pattern);
    if (match && match[1]) {
      fileId = match[1];
      break;
    }
  }

  // Only File ID was pasted
  if (!fileId && /^[a-zA-Z0-9_-]{25,}$/.test(str)) {
    fileId = str;
  }

  // Already a normal image URL
  if (!fileId && str.startsWith('http') && !str.includes('drive.google.com')) {
    return str;
  }

  if (!fileId) return null;

  // More reliable Google Drive image URL
  return `https://lh3.googleusercontent.com/d/${fileId}`;
}
    
// Helper: show emoji or image icon
function renderProductIcon(p, large = false) {
  const icon = (p.icon || '').toString().trim();
  const sizeClass = large ? 'text-4xl' : 'text-2xl';

  console.log('ICON VALUE:', icon);   // ← check browser console

  if (!icon) {
    return `<span class="${sizeClass}">📦</span>`;
  }

  if (icon.length <= 4 && !icon.includes('http') && !icon.includes('drive')) {
    return `<span class="${sizeClass}">${icon}</span>`;
  }

  const imageUrl = getDriveImageUrl(icon);
  console.log('IMAGE URL:', imageUrl);

  if (imageUrl) {
    return `
      <img src="${imageUrl}" 
           class="w-full h-full object-cover" 
           alt="${p.name || ''}"
           onerror="console.log('IMAGE FAILED:', this.src); this.parentElement.innerHTML='<span class=\\'${sizeClass}\\'>📦</span>'" />
    `;
  }

  return `<span class="${sizeClass}">📦</span>`;
}

  const res = await apiPost('resolveKey', {

    productCode: state.selectedProduct.code

  render();

  const bankOptions = state.paymentOptions.filter(o => o.mode === 'BANK');
  const telebirrOptions = state.paymentOptions.filter(o => o.mode === 'TELEBIRR');

  return `
    ${header('Payment Details', "state.buyStep='key'; render()")}
    <main class="px-4 pt-5 pb-36 space-y-4 fade-in">

      <!-- Order Summary - uses selected product -->
      <div class="bg-card border border-border rounded-xl p-4 space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-muted">Product</span>
          <span class="font-medium">${p?.name || d?.productName || '-'}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Product Key</span>
          <span class="mono text-xs">${d?.productKey || state.productKey}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Type</span>
          <span>${d?.isRenewal ? 'Renewal (Key ' + d.nextRenewal + ')' : 'New License'}</span>
        </div>
        <div class="flex justify-between pt-2 border-t border-border">
          <span class="text-muted">Amount to Pay</span>
          <span class="text-emerald-400 font-bold text-lg">${p?.price || d?.price || 0} ETB</span>
        </div>
      </div>

      <!-- Payment Methods -->
      <div class="space-y-3">
        <h3 class="text-xs uppercase tracking-wider text-muted">Payment Methods</h3>

        ${bankOptions.length ? `
          <div class="bg-card border border-border rounded-xl p-4">
            <div class="font-medium mb-3">🏦 Bank Transfer</div>
            ${bankOptions.map(o => `
              <div class="mb-3 last:mb-0 pb-3 last:pb-0 border-b last:border-0 border-border">
                <div class="font-medium text-sm">${o.bank}</div>
                <div class="text-xs text-muted">${o.accountName}</div>
                <div class="mono text-sm mt-1">${o.accountNumber}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${telebirrOptions.length ? `
          <div class="bg-card border border-border rounded-xl p-4">
            <div class="font-medium mb-3">📱 Telebirr</div>
            ${telebirrOptions.map(o => `
              <div class="mono text-lg">${o.wallet}</div>
            `).join('')}
          </div>
        ` : ''}

        ${!bankOptions.length && !telebirrOptions.length ? `
          <div class="text-sm text-muted text-center py-4">No payment methods available</div>
        ` : ''}
      </div>

      <p class="text-xs text-muted text-center">
        Make the payment using one of the methods above, then click the button below.
      </p>
    </main>

    <div class="fixed bottom-16 inset-x-0 max-w-md mx-auto p-4 z-40">
      <button onclick="state.buyStep='txn'; render()" 
        class="w-full py-3 rounded-xl bg-emerald-500 text-white font-semibold">
        💳 I Have Paid
      </button>
    </div>
    ${bottomNav('license')}`;
}
    
function renderLicenseTxn() {
  return `
    ${header('Transaction Number', "state.buyStep='payment'; render()")}
    <main class="px-4 pt-6 pb-32 space-y-5 fade-in">
      <p class="text-sm text-slate-300">
        Enter the Transaction Number from your payment receipt.
      </p>

      <div>
        <label class="text-xs text-muted uppercase tracking-wider mb-1 block">Transaction Number</label>
        <input type="text" value="${state.txnNumber}"
          oninput="state.txnNumber = this.value"
          placeholder="e.g. TXN123456 or reference number"
          class="w-full bg-bg border border-border rounded-lg px-3 py-3 text-sm mono" />
      </div>
    </main>

    <div class="fixed bottom-16 inset-x-0 max-w-md mx-auto p-4 z-40">
      <button onclick="submitOrder()" class="w-full py-3 rounded-xl bg-emerald-500 text-white font-semibold">
        Submit Order
      </button>
    </div>
    ${bottomNav('license')}`;
}

async function submitOrder() {
  if (!state.txnNumber.trim()) return toast('Please enter Transaction Number');
  if (!state.user.chatId) return toast('User not found');

  toast('Submitting order...');

  const res = await apiPost('createOrder', {
  chatId: state.user.chatId,
  phone: state.user.phone || '',
  productKey: state.productKey.trim(),
  productCode: state.selectedProduct.code,  // important
  paymentMode: state.paymentMode || 'BANK',
  txnNumber: state.txnNumber.trim()
});

  if (!res.success) {
    toast(res.message || 'Failed to submit order');
    return;
  }

  state.currentOrderId = res.data.orderId;
  state.buyStep = 'done';
  render();
}

function renderLicenseDone() {
  return `
    ${header('Order Submitted')}
    <main class="px-4 pt-10 pb-32 text-center space-y-4 fade-in">
      <div class="text-5xl">⏳</div>
      <h2 class="text-lg font-semibold">Under Process for Approval</h2>
      
      <div class="bg-card border border-border rounded-xl p-4 text-sm text-left space-y-2">
        <div class="flex justify-between">
          <span class="text-muted">Order ID</span>
          <span class="mono">${state.currentOrderId}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Status</span>
          <span class="text-amber-400">Pending Approval</span>
        </div>
      </div>

      <p class="text-sm text-muted">
        Your payment is being reviewed.<br>
        You will receive the License Key after approval.
      </p>
    </main>

    <div class="fixed bottom-16 inset-x-0 max-w-md mx-auto p-4 z-40">
      <button onclick="resetBuy(); navigate('profile')" 
        class="w-full py-3 rounded-xl bg-emerald-500 text-white font-semibold">
        Go to My Orders
      </button>
    </div>
    ${bottomNav('license')}`;
}

function resetBuy() {
  state.buyStep = null;
  state.selectedProduct = null;
  state.productKey = '';
  state.resolvedKey = null;
  state.paymentMode = null;
  state.paymentOptions = [];
  state.txnNumber = '';
  state.currentOrderId = null;
}

    // ================= PROFILE =================
   function renderProfile() {
  return `
    ${header(t('profile_title'))}
    <main class="px-4 pt-4 space-y-4 fade-in">
      ${!state.user.registered ? `
        <div class="bg-card border border-border rounded-xl p-4 space-y-3">
          <h2 class="font-semibold">${t('registration_required_title')}</h2>
          <input type="text" placeholder="${t('full_name')}" value="${state.regName}"
            oninput="state.regName=this.value"
            class="w-full bg-bg border border-border rounded-lg px-3 py-2.5 text-sm" />
          <input type="tel" placeholder="${t('phone_number')}" value="${state.regPhone}"
            oninput="state.regPhone=this.value"
            class="w-full bg-bg border border-border rounded-lg px-3 py-2.5 text-sm" />
          <button onclick="register()" class="w-full py-2.5 rounded-lg bg-emerald-500 text-white font-medium">
            ${t('register')}
          </button>
        </div>
      ` : `
        <div class="bg-card border border-border rounded-xl p-4">
          <div class="font-semibold">${state.user.name}</div>
          <div class="text-xs text-muted mono mt-1">Chat ID: ${state.user.chatId}</div>
          <div class="text-sm text-emerald-400 mt-2">✅ ${t('registered')}</div>
        </div>
      `}

      ${languageSwitcher()}

      <div>
        <h2 class="text-xs uppercase text-muted mb-2">${t('my_licenses')}</h2>
        <div id="licensesList" class="text-sm text-muted">${t('loading')}</div>
      </div>

      <div>
        <h2 class="text-xs uppercase text-muted mb-2">${t('my_orders')}</h2>
        <div id="ordersList" class="text-sm text-muted">${t('loading')}</div>
      </div>
    </main>
    ${bottomNav('profile')}`;
}
    
    async function register() {
      if (!state.regName.trim() || !state.regPhone.trim()) return toast('Enter name and phone');
      if (!state.user.chatId) return toast('Telegram ID not found');

      toast('Registering...');
      const res = await apiPost('register', {
        chatId: state.user.chatId,
        name: state.regName.trim(),
        phone: state.regPhone.trim()
      });

      if (res.success) {
        state.user.registered = true;
        state.user.name = state.regName.trim();
        state.user.phone = state.regPhone.trim();
        toast(`Registered! User: ${res.data.username} / Pass: ${res.data.password}`);
        render();
      } else {
        toast(res.message || 'Registration failed');
      }
    }

   async function loadProfileData() {
  if (!state.user.chatId) return;

  const [orders, licenses] = await Promise.all([
    apiGet('getMyOrders',   { chatId: state.user.chatId }),
    apiGet('getMyLicenses', { chatId: state.user.chatId })
  ]);

  const ordersEl   = document.getElementById('ordersList');
  const licensesEl = document.getElementById('licensesList');

  // ================= 1. RENDER ORDERS =================
  if (ordersEl) {
    if (orders.success && orders.data.length) {
      ordersEl.innerHTML = orders.data.map(o => `
        <div class="bg-card border border-border rounded-xl p-3 mb-2">
          <div class="flex justify-between text-sm">
            <span>${o.productCode}</span>
            <span class="${o.status === 'APPROVED' ? 'text-emerald-400' : o.status === 'REJECTED' ? 'text-red-400' : 'text-amber-400'}">
              ${o.status}
            </span>
          </div>
          <div class="text-xs text-muted mt-1">Txn: ${o.txnNumber}</div>
        </div>
      `).join('');
    } else {
      ordersEl.innerHTML = `<div class="bg-card border border-border rounded-xl p-4 text-center text-muted">No orders yet</div>`;
    }
  }

  // ================= 2. RENDER LICENSES =================
  if (licensesEl) {
    if (licenses.success && licenses.data.length) {
      licensesEl.innerHTML = licenses.data.map(l => {
        
        // Safely parse the renewal number (defaults to 1 if broken)
        let renewal = parseInt(l.currentRenewal, 10);
        if (isNaN(renewal) || renewal < 1) renewal = 1; 
        if (renewal > 5) renewal = 5;

        // Get the keys
        const keys = [l.key1, l.key2, l.key3, l.key4, l.key5];
        const ordinals = ['1st', '2nd', '3rd', '4th', '5th'];

        // Only show keys up to the current renewal, and hide empty ones
        const keyLines = keys
          .slice(0, renewal)
          .map((k, idx) => {
            if (!k || k === '') return ''; 

            return `
              <div class="flex justify-between items-center py-1 border-b border-border last:border-0">
                <span class="text-xs text-muted">${ordinals[idx]} license key</span>
                <span class="mono text-emerald-400 text-xs">${k}</span>
              </div>
            `;
          })
          .join('');

        const canRenew = renewal < 5;

        return `
          <div class="bg-card border border-border rounded-xl p-3 mb-2 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <div class="font-medium text-sm">${l.productCode}</div>
                <div class="text-xs text-muted mono">Product Key: ${l.productKey}</div>
              </div>
              <!-- 🚨 THE 2/5 BADGE WAS HERE AND IS NOW REMOVED 🚨 -->
            </div>

            <div class="bg-bg border border-border rounded-lg px-3 py-1">
              ${keyLines || '<div class="text-xs text-muted py-2 text-center">No keys assigned</div>'}
            </div>

            ${canRenew ? `
              <button onclick="startRenewal('${l.productKey}', '${l.productCode}')"
                  class="w-full py-2 rounded-lg bg-emerald-500/15 text-emerald-400 text-xs font-semibold">
                   🔄 Renew (get next license key)
                  </button>
            ` : `
              <div class="text-center text-xs text-amber-400 py-2">
                All 5 keys issued — contact support to extend
              </div>
            `}
          </div>
        `;
      }).join('');
    } else {
      licensesEl.innerHTML = `<div class="bg-card border border-border rounded-xl p-4 text-center text-muted">No licenses yet</div>`;
    }
  }
}
//==============start renewal===========

async function startRenewal(productKey, productCode) {
  // Make sure products are loaded
  if (state.products.length === 0) {
    toast('Loading...');
    await loadProducts();
  }

  const product = state.products.find(p => p.code === productCode) || null;

  if (!product) {
    toast('Product not found');
    return;
  }

  state.selectedProduct = product;
  state.buyStep = 'key';
  state.productKey = productKey;
  state.resolvedKey = null;
  state.paymentMode = null;
  state.paymentOptions = [];
  state.txnNumber = '';
  state.currentOrderId = null;

  navigate('license');
}

      
    // ================= RENDER =================
  function render() {
  if (!state.appReady) {
    document.getElementById('app').innerHTML = `
      <div class="min-h-screen flex items-center justify-center">
        <div class="text-center">
          <div class="text-3xl mb-3">🔐</div>
          <div class="text-muted text-sm">Loading...</div>
        </div>
      </div>`;
    return;
  }

  if (state.isAdmin && (state.route === 'home' || !state.route.startsWith('admin'))) {
    state.route = 'admin-dashboard';
  }

  const map = {
    home: renderHome,
    products: renderProducts,
    license: renderLicense,
    profile: renderProfile,
    'admin-dashboard': renderAdminDashboard,
    'admin-approvals': renderAdminApprovals,
    admin: renderAdminApprovals
  };

  document.getElementById('app').innerHTML = (map[state.route] || renderHome)();

  if (state.route === 'profile') loadProfileData();
  if (state.route === 'admin-approvals' || state.route === 'admin') {
    renderPendingList();
  }

  // Fix: load stats after HTML is in the page
  if (state.route === 'admin-dashboard') {
    setTimeout(loadAdminDashboard, 150);
  }
}
    render();
  </script>
</body>
</html>
